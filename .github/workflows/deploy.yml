name: Deploy GitHub Pages + Archive.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout full history
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Detect relevant changes
      # -----------------------------
      - name: Detect relevant changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q "ALL"; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif ! echo "$CHANGED" | grep -qE "^(PKGS/|index.html|spudzy.js)"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop early if no changes
        if: steps.changes.outputs.skip == 'true'
        run: |
          echo "No relevant changes detected. Skipping deployment."
          exit 0

      # -----------------------------
      # Inject YouTube API key
      # -----------------------------
      - name: Inject YouTube API key
        run: |
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "Missing YOUTUBE_API_KEY"
            exit 1
          fi

          find . \( -name "spudzy.js" -o -name "index.html" \) -type f -exec sed -i "s|__YOUTUBE_API_KEY__|${{ secrets.YOUTUBE_API_KEY }}|g" {} \;

      # -----------------------------
      # Broken link checker
      # -----------------------------
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: --verbose .
        continue-on-error: true

      # -----------------------------
      # JS syntax check
      # -----------------------------
      - name: JS Syntax Check
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx eslint .
          else
            echo "ESLint not available"
          fi
        continue-on-error: true

      # -----------------------------
      # Skip docs-only commits
      # -----------------------------
      - name: Skip deploy for docs-only commits
        if: contains(github.event.head_commit.message, '[docs]')
        run: |
          echo "Docs-only commit detected — skipping deploy"
          exit 0

      # -----------------------------
      # Restore archive cache
      # -----------------------------
      - name: Restore Archived Versions Cache
        uses: actions/cache/restore@v4
        with:
          path: archive
          key: archive-v2-${{ github.sha }}
          restore-keys: |
            archive-v2-

      # -----------------------------
      # Build archive snapshots
      # -----------------------------
      - name: Auto-Archive & Remove Unnecessary Files
        run: |
          echo "Synchronizing optimized historical timeline..."
          mkdir -p archive
          touch archive/processed_commits.txt

          if [ -d "archive" ] && [ $(du -s archive | awk '{print $1}') -gt 500000 ]; then
            echo "Archive too large — resetting"
            rm -rf archive
            mkdir -p archive
            touch archive/processed_commits.txt
          fi

          git log --reverse --format="%h|%cd" --date=short | awk -F'|' '
            {
              split($2, dateParts, "-");
              monthKey = dateParts[1] "-" dateParts[2];
              if (!seen[monthKey]++) { print $0 }
            }
          ' | while IFS='|' read -r hash date; do

            if grep -q "$hash" archive/processed_commits.txt; then
              continue
            fi

            VERSION_LABEL="v$(echo "$date" | cut -d'-' -f1-2)"
            echo "Processing snapshot: $VERSION_LABEL ($hash)"

            rm -rf "archive/$VERSION_LABEL"
            mkdir -p "archive/$VERSION_LABEL"

            git archive "$hash" | tar -x -C "archive/$VERSION_LABEL"

            find "archive/$VERSION_LABEL" -type f \( \
              -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o \
              -name "*.svg" -o -name "*.mp4" -o -name "*.mp3" -o -name "*.zip" -o \
              -name "*.tar.gz" -o -name "*.md" -o -name "*.json" -o \
              -name "package-lock.json" -o -name ".eslintrc*" -o -name ".gitignore" \
            \) -delete

            find "archive/$VERSION_LABEL" -type d -empty -delete

            echo "$hash" >> archive/processed_commits.txt
          done

          CURRENT_DATE=$(date +'%Y-%m-%d')
          echo "Updating live checkpoint: archive/$CURRENT_DATE"
          rm -rf "archive/$CURRENT_DATE"
          mkdir -p "archive/$CURRENT_DATE"
          rsync -av --exclude='archive' --exclude='.git' --exclude='.github' ./ "archive/$CURRENT_DATE/"

      # -----------------------------
      # Save archive cache
      # -----------------------------
      - name: Save Updated Archive Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: archive
          key: archive-v2-${{ github.sha }}

      # -----------------------------
      # GitHub Pages deployment
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Archive.org Upload (FIXED)
      # -----------------------------
      - name: Upload to Archive.org
        if: steps.changes.outputs.skip == 'false'
        env:
          IA_ACCESS_KEY: ${{ secrets.ARCHIVEORG_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.ARCHIVEORG_SECRET_KEY }}
        run: |
          pip install internetarchive

          echo "Packaging site for Archive.org..."
          tar -cvf site.tar .

          echo "Uploading to Archive.org..."
          ia upload "alaricholt677.github.io" site.tar \
            --metadata="title=GitHub Pages Snapshot" \
            --metadata="mediatype=software" \
            --metadata="description=Automated deployment snapshot from GitHub Actions"

      - name: Save to Wayback Machine
        if: always()
        run: |
          curl -X GET "https://web.archive.org/save/https://alaricholt677.github.io/"
