name: Deploy GitHub Pages + Archive.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Inject YouTube API key when available
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo "YOUTUBE_API_KEY is unavailable; skipping injection."
            exit 0
          fi
          find . \( -name "spudzy.js" -o -name "index.html" \) \
            -type f -not -path "./.git/*" -not -path "./archive/*" \
            -exec sed -i "s|__YOUTUBE_API_KEY__|${YOUTUBE_API_KEY}|g" {} \;

      - name: Check links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: --verbose --exclude-path .git --exclude-path archive .
        continue-on-error: true

      - name: JavaScript syntax check
        shell: bash
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx eslint .
          else
            echo "ESLint is unavailable."
          fi
        continue-on-error: true

      - name: Restore archive cache
        uses: actions/cache/restore@v4
        with:
          path: archive
          key: archive-v2-${{ github.sha }}
          restore-keys: |
            archive-v2-

      - name: Build archive snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          touch archive/processed_commits.txt
          if [ "$(du -s archive | awk '{print $1}')" -gt 500000 ]; then
            rm -rf archive
            mkdir -p archive
            touch archive/processed_commits.txt
          fi
          git log --reverse --format="%h|%cd" --date=short | awk -F'|' '
            {
              split($2, dateParts, "-");
              monthKey = dateParts[1] "-" dateParts[2];
              if (!seen[monthKey]++) print $0;
            }
          ' | while IFS='|' read -r hash date; do
            if grep -Fq "$hash" archive/processed_commits.txt; then continue; fi
            label="v$(printf '%s' "$date" | cut -d'-' -f1-2)"
            rm -rf "archive/$label"
            mkdir -p "archive/$label"
            git archive "$hash" | tar -x -C "archive/$label"
            find "archive/$label" -type f \( \
              -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o \
              -name "*.gif" -o -name "*.svg" -o -name "*.mp4" -o \
              -name "*.mp3" -o -name "*.zip" -o -name "*.tar.gz" -o \
              -name "*.md" -o -name "*.json" -o -name "package-lock.json" -o \
              -name ".eslintrc*" -o -name ".gitignore" \) -delete
            find "archive/$label" -type d -empty -delete
            echo "$hash" >> archive/processed_commits.txt
          done
          current_date="$(date +'%Y-%m-%d')"
          rm -rf "archive/$current_date"
          mkdir -p "archive/$current_date"
          rsync -av --exclude='archive' --exclude='.git' --exclude='.github' --exclude='_site' ./ "archive/$current_date/"

      - name: Save archive cache
        uses: actions/cache/save@v4
        with:
          path: archive
          key: archive-v2-${{ github.sha }}

      - name: Prepare Pages directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -av --delete \
            --exclude='.git' --exclude='.github' --exclude='_site' --exclude='site.tar' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/gmstore/online/index.html
          test -f _site/gmstore/online/index.json
          du -sh _site

      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1

      - name: Confirm Pages artifact
        shell: bash
        run: |
          echo "Artifact ID: ${{ steps.upload.outputs.artifact_id }}"
          test -n "${{ steps.upload.outputs.artifact_id }}"

      - name: Upload snapshot to Archive.org
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.ARCHIVEORG_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.ARCHIVEORG_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${IA_ACCESS_KEY:-}" ] || [ -z "${IA_SECRET_KEY:-}" ]; then
            echo "Archive.org credentials unavailable; skipping."
            exit 0
          fi
          python -m pip install internetarchive
          tar -cvf site.tar -C _site .
          ia upload "alaricholt677.github.io" site.tar \
            --metadata="title=GitHub Pages Snapshot" \
            --metadata="mediatype=software" \
            --metadata="description=Automated deployment snapshot from GitHub Actions"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Report deployed URL
        shell: bash
        run: echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"

  wayback:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Request Wayback Machine snapshot
        continue-on-error: true
        shell: bash
        run: |
          curl --silent --show-error --dump-header - --output /dev/null \
            "https://web.archive.org/save/https://alaricholt677.github.io/"