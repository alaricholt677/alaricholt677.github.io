<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,sans-serif;color:#f7efff;background:radial-gradient(circle at 20% 10%,#521879,transparent 35%),linear-gradient(145deg,#08040f,#170b26);min-height:100vh}header{text-align:center;padding:70px 20px 35px}h1{font-size:clamp(48px,9vw,92px);margin:0;color:#dfadff}header p{color:#cbb8d8;font-size:18px}main{width:min(1100px,calc(100% - 32px));margin:auto}.status,.game{background:#251535cc;border:1px solid #8b52b7;border-radius:18px;padding:20px}.status{margin-bottom:18px}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.game h2{margin-top:0}.game p{color:#cfbfd9}.game a{display:inline-block;padding:12px 16px;border-radius:10px;color:white;text-decoration:none;font-weight:700;background:linear-gradient(90deg,#b64cff,#685cff)}</style></head><body><header><h1>GM STORE</h1><p>Games delivered to the GM Store RAM launcher.</p></header><main><div class="status" id="status">Loading catalog...</div><section id="games"></section></main><script>fetch('./index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(c=>{let a=Array.isArray(c.games)?c.games:[];status.textContent=a.length+' game(s) available';for(let g of a){let e=document.createElement('article');e.className='game';let h=document.createElement('h2');h.textContent=g.name;let p=document.createElement('p');p.textContent=g.description;let m=document.createElement('p');m.textContent='Version '+g.version+' | RAM '+g.ramMb+' MB';let b=document.createElement('a');b.href=g.download;b.textContent='Download package';e.append(h,p,m,b);games.append(e)}}).catch(e=>status.textContent='Catalog error: '+e.message)</script></body></html>
