# Incremental History Tracking Deployment Workflow

name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout with Full Git History
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: Fetches every single historic commit back to December 2025

      # -----------------------------
      # Dynamic: Skip deploy if no relevant changes (FIXED)
      # -----------------------------
      - name: Detect relevant changes

        id: changes
        run: |
          # Safe diff: works even with shallow clones
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q "ALL"; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif ! echo "$CHANGED" | grep -qE "^(PKGS/|index.html|spudzy.js)"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Stop early if no changes
        if: steps.changes.outputs.skip == 'true'
        run: |
          echo "No relevant changes detected. Skipping deployment."
          exit 0


      # -----------------------------
      # Secret injection
      # -----------------------------
      - name: Inject YouTube API key
        run: |
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "YOUTUBE_API_KEY secret is empty or missing"
            exit 1
          fi

          find . \( -name "spudzy.js" -o -name "index.html" \) -type f -print -exec sed -i "s|__YOUTUBE_API_KEY__|${{ secrets.YOUTUBE_API_KEY }}|g" {} \;

          if grep -R "__YOUTUBE_API_KEY__" PKGS/spudzy --include="spudzy.js" --include="index.html"; then
            echo "Placeholder still exists in PKGS/spudzy"
            exit 1
          fi

          echo "Placeholder replaced in Spudzy files"
          

      # -----------------------------
      # Dynamic: Broken link checker (PR merge preserved)
      # -----------------------------
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: --verbose .
        continue-on-error: true

      # -----------------------------
      # Dynamic: JS syntax check
      # -----------------------------
      - name: JS Syntax Check
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx eslint .
          else
            echo "ESLint not available — skipping JS linter"
          fi

        continue-on-error: true

      # -----------------------------
      # Dynamic: Conditional deploy based on commit message
      # -----------------------------
      - name: Skip deploy for docs-only commits
        if: contains(github.event.head_commit.message, '[docs]')
        run: |
          echo "Docs-only commit detected — skipping deploy"
          exit 0
      # -----------------------------
      # Restore Accumulated Archive Directory via GitHub Actions Cache
      # -----------------------------
      - name: Restore Archived Versions Cache
        uses: actions/cache/restore@v4
        with:
          path: archive
          key: archive-history-${{ github.sha }}

          restore-keys: |
            archive-history-
      # -----------------------------
      # Zero-Work Automated Incremental Archiving
      # -----------------------------
      - name: Auto-Rebuild Missing History Natively
        run: |
          echo "Checking for existing history structure..."
          mkdir -p archive
          touch archive/processed_commits.txt

          # Walk through every single commit in chronological order (oldest to newest)
          git log --reverse --format="%h|%cd" --date=short | while IFS='|' read -r hash date; do
            
            # Skip instantly if this exact commit hash was already processed and stored in the cache
            if grep -q "$hash" archive/processed_commits.txt; then
              continue
            fi


            echo "New/Unprocessed commit milestone found: $date (commit: $hash)"
            
            # Reset folder state for that specific day
            rm -rf "archive/$date"
            mkdir -p "archive/$date"
            
            # Extract raw code state natively from git history object database
            git archive "$hash" | tar -x -C "archive/$date"
            
            # Inject key parity into newly discovered historical builds
            if [ -n "${{ secrets.YOUTUBE_API_KEY }}" ]; then
              find "archive/$date" \( -name "spudzy.js" -o -name "index.html" \) -type f -exec sed -i "s|__YOUTUBE_API_KEY__|${{ secrets.YOUTUBE_API_KEY }}|g" {} \; 2>/dev/null || true
            fi

            # Record commit as tracked so it never processes again
            echo "$hash" >> archive/processed_commits.txt
          done
          
          echo "All missing historical versions synchronized."

      # -----------------------------
      # Save Updated Archive Storage Directory to Cache
      # -----------------------------
      - name: Save Updated Archive Cache
        uses: actions/cache/save@v4
        if: always() # Guarantees archive survival even if deployment validation trips later
        with:
          path: archive
          key: archive-history-${{ github.sha }}

      # -----------------------------
      # Pages deployment
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:

          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


