<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusicSpudzy Ultimate</title><style>
:root{--a:#ff1744;--b:#620018;--bg:#060102;--panel:#16060a;--text:#fff5f7;--muted:#c9a5ad;--line:#ffffff1c;--radius:20px;--blur:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,color-mix(in srgb,var(--a) 35%,transparent),transparent 32%),linear-gradient(155deg,var(--panel),var(--bg) 72%);color:var(--text);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:var(--a);color:#fff;font-weight:850;cursor:pointer}.ghost{background:#ffffff0d;border:1px solid var(--line)}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 13px;background:#090204e8;border-right:1px solid var(--line);backdrop-filter:blur(var(--blur))}.brand{font-size:25px;font-weight:950;letter-spacing:-.06em;margin:4px 8px 18px}.brand span{color:var(--a)}.nav button{width:100%;text-align:left;background:transparent;margin:2px 0}.nav button.active,.nav button:hover{background:#ffffff11}.net{margin:15px 8px;color:#79f39b}.main{padding:24px 26px 120px}.page{display:none}.page.active{display:block}.hero{padding:26px;border:1px solid var(--line);border-radius:calc(var(--radius) + 8px);background:linear-gradient(135deg,var(--a),var(--b));margin-bottom:16px}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.88;letter-spacing:-.07em;margin:0 0 12px}.panel,.card{padding:17px;border:1px solid var(--line);border-radius:var(--radius);background:#ffffff0a;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.songs{display:grid;gap:8px}.song{display:grid;grid-template-columns:minmax(160px,1fr) 52px repeat(4,auto);gap:8px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:15px;background:#ffffff08}.title{font-weight:900}.meta{color:var(--muted);font-size:12px;line-height:1.5}.bars{width:48px;height:28px}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}label{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;margin:11px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#ffffff0d;color:var(--text)}textarea{min-height:100px}.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}.player{position:fixed;left:240px;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 20px;background:#0b0205ed;border-top:1px solid var(--line);backdrop-filter:blur(18px)}dialog{width:min(650px,94vw);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:22px;padding:20px}dialog::backdrop{background:#000c}.modalhead{display:flex;justify-content:space-between}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{display:none;position:fixed;right:20px;bottom:100px;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);z-index:30}.auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(145deg,var(--bg),#020101)}.auth.hidden{display:none}.authbox{width:min(420px,94vw);padding:25px;border:1px solid var(--line);border-radius:24px;background:var(--panel)}.locked{opacity:.35;pointer-events:none}.stylegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.main{padding:14px 10px 145px}.player{left:0;grid-template-columns:1fr auto}.player>div:last-child{display:none}.song{grid-template-columns:1fr 48px auto}.desktop{display:none}.two{grid-template-columns:1fr}}
</style></head><body><div id="auth" class="auth"><div class="authbox"><div class="brand">MUSIC<span>SPUDZY</span></div><h2 id="authTitle">Sign in</h2><label>Username</label><input id="au"><label>Password</label><input id="ap" type="password"><div class="row"><button onclick="authGo()" id="authBtn">Sign in</button><button class="ghost" onclick="authToggle()" id="authToggle">Create account</button></div><p id="authMsg" class="meta"></p></div></div><div class="app"><aside class="side"><div class="brand">MUSIC<span>SPUDZY</span></div><nav class="nav" id="nav"></nav><div id="net" class="net"></div></aside><main class="main" id="pages"></main></div><div class="player"><div><div id="now" class="title">Nothing playing</div><div id="artist" class="meta">Choose a song</div></div><div class="row"><button class="ghost" onclick="prev()">⏮</button><button id="play" onclick="toggle()">▶</button><button class="ghost" onclick="next()">⏭</button></div><div><input id="seek" type="range" min="0" max="100" value="0"></div></div><dialog id="modal"><div class="modalhead"><h3 id="mt"></h3><button class="ghost" onclick="closeM()">✕</button></div><div id="mb"></div><div id="ma" class="actions"></div></dialog><div id="toast" class="toast"></div>
<script src="https://alaricholt677.github.io/PKGS/music-spud/spudzy-music-ai.js"></script><script>
const ROUTES=[['home','⌂ Home'],['studio','＋ Studio'],['search','⌕ Search'],['library','♫ Library'],['liked','♥ Liked'],['playlists','▤ Playlists'],['downloads','↓ Downloads'],['queue','≡ Queue'],['recent','◴ Recent'],['history','↶ History'],['discover','✦ Discover'],['trending','↗ Trending'],['for-you','✧ For You'],['upload','↑ Upload'],['pending','◷ Pending'],['published','✓ Published'],['following','＋ Following'],['followers','● Followers'],['notifications','◉ Notifications'],['profile','● Profile'],['equalizer','≋ Equalizer'],['sleep','☾ Sleep'],['scanner','▦ WAVE Scanner'],['guide','? Guide'],['settings','⚙ Settings']];const KEY='MUSICSPUDZY_ULTIMATE_V3',AUTH='MUSICSPUDZY_ACCOUNTS',SESSION='MUSICSPUDZY_SESSION',FALLBACK='downloaded-music-spudzy';let S=load(KEY)||{songs:[],liked:[],playlists:[],downloads:[],queue:[],history:[],pending:[],published:[],following:[],followers:[],notifications:[],notes:{},profile:{name:'Spudzy',bio:'Making waves.'},settings:{a:'#ff1744',b:'#620018',bg:'#060102',panel:'#16060a',text:'#fff5f7',muted:'#c9a5ad',radius:20,blur:18,look:'glass',offline:true}};if(!S.songs.length)S.songs=[{id:uid(),title:'Spudzy Red Wave',artist:'Spudzy',signature:'spudzy',bars:16,prompt:'red synth wave',lyrics:'Spudzy rides the wave tonight',tts:true,ttsRate:1.08,ttsPitch:1.2,ttsVolume:.95,createdAt:Date.now()}];let current=null,playing=false,audio=new Audio(),active=null,sleep=null,authMode='in';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(FALLBACK,JSON.stringify({songs:S.songs,downloads:S.downloads,notes:S.notes,settings:S.settings,at:Date.now()}))}function uid(){return'spud_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}function note(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function go(r){location.hash='#/'+r}function modal(t,b,a=''){$('mt').textContent=t;$('mb').innerHTML=b;$('ma').innerHTML=a;$('modal').showModal()}function closeM(){$('modal').close()}function hero(t,p){return`<div class="hero"><h1>${t}</h1><p>${p}</p></div>`}function empty(t){return`<div class="empty">${t}</div>`}
function authToggle(){authMode=authMode==='in'?'up':'in';$('authTitle').textContent=authMode==='in'?'Sign in':'Create account';$('authBtn').textContent=authMode==='in'?'Sign in':'Sign up';$('authToggle').textContent=authMode==='in'?'Create account':'Back'}function hash(p){let h=2166136261;for(const c of p){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function authGo(){const u=$('au').value.trim(),p=$('ap').value,a=load(AUTH)||{};if(!u||p.length<4)return $('authMsg').textContent='Use a username and 4+ character password.';if(authMode==='up'){if(a[u])return $('authMsg').textContent='Username exists.';a[u]={p:hash(p)};localStorage.setItem(AUTH,JSON.stringify(a))}else if(!a[u]||a[u].p!==hash(p))return $('authMsg').textContent='Incorrect login.';localStorage.setItem(SESSION,u);$('auth').classList.add('hidden')}function logout(){localStorage.removeItem(SESSION);$('auth').classList.remove('hidden')}
function apply(){const t=S.settings,z=document.documentElement.style;[['--a',t.a],['--b',t.b],['--bg',t.bg],['--panel',t.panel],['--text',t.text],['--muted',t.muted],['--radius',t.radius+'px'],['--blur',t.blur+'px']].forEach(x=>z.setProperty(...x));document.body.dataset.look=t.look}function nav(){ $('nav').innerHTML=ROUTES.map(([r,n])=>`<button data-r="${r}" onclick="go('${r}')">${n}</button>`).join('')}function route(){let h=location.hash.replace(/^#\//,'')||'home',m=h.match(/^song\/(.+)$/);render(m?'song':h,m?decodeURIComponent(m[1]):null);document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',b.dataset.r===h));$('net').textContent=navigator.onLine?'● Online':'● Offline'}window.addEventListener('hashchange',route);window.addEventListener('online',route);window.addEventListener('offline',route);
function row(s){return`<div class="song"><div onclick="go('song/${encodeURIComponent(s.id)}')"><div class="title">${esc(s.title)}</div><div class="meta">${esc(s.artist)} · ${esc(s.signature)}</div></div><svg class="bars" data-w="${s.id}" viewBox="0 0 48 28"><rect x="2" y="12" width="9" height="14" fill="var(--a)"/><rect x="19" y="5" width="9" height="21" fill="#ff7390"/><rect x="36" y="9" width="9" height="17" fill="var(--a)"/></svg><button onclick="playSong('${s.id}')">▶</button><button class="ghost desktop" onclick="like('${s.id}')">${S.liked.includes(s.id)?'♥':'♡'}</button><button class="ghost desktop" onclick="queue('${s.id}')">＋</button><button class="ghost" onclick="menu('${s.id}')">•••</button></div>`}function rows(a,t){return`<div class="songs">${a.map(row).join('')||empty(t)}</div>`}
function render(r,id){const songs=S.songs;let x='';if(r==='home')x=hero('Your sound, routed.','The complete MusicSpudzy library, creator, social, publishing, offline, and WAVE system.')+`<div class="grid">${[['Songs',songs.length],['Liked',S.liked.length],['Playlists',S.playlists.length],['Downloads',S.downloads.length]].map(v=>`<div class="card"><h3>${v[1]} ${v[0]}</h3></div>`).join('')}</div><h2>Jump back in</h2>`+rows(songs.slice(0,6),'No songs');else if(r==='studio')x=hero('Studio','Create an original song entry.')+`<div class="panel"><div class="two"><div><label>Title</label><input id="ft" value="New Spudzy Wave"></div><div><label>Artist</label><input id="fa" value="${esc(S.profile.name)}"></div><div><label>Signature</label><select id="fs"><option>spudzy</option><option>chiptune</option><option>lofi</option><option>edm</option><option>ambient</option><option>rock</option></select></div><div><label>Bars</label><input id="fb" type="number" value="16"></div></div><label>Prompt</label><textarea id="fp">red gradient synth wave</textarea><label>Lyrics</label><textarea id="fl"></textarea><button onclick="create()">Create</button></div>`;else if(r==='search')x=hero('Search','Find songs across every field.')+`<div class="panel"><input id="q" placeholder="Search" oninput="search()"><div id="qr"></div></div>`;else if(r==='library')x=hero('Library','Every song on this device.')+`<button onclick="importMP3()">Import MP3</button>`+rows(songs,'Empty');else if(r==='liked')x=hero('Liked Songs','Automatic playlist of every liked song.')+rows(songs.filter(s=>S.liked.includes(s.id)),'No liked songs');else if(r==='playlists')x=hero('Playlists','Create and manage collections.')+`<button onclick="newPL()">Create playlist</button><div class="grid">${S.playlists.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${p.songs.length} songs</p><button onclick="openPL('${p.id}')">Open</button></div>`).join('')||empty('No playlists')}</div><div id="pld"></div>`;else if(r==='downloads')x=hero('Downloads','Offline song records and attached MP3 files.')+rows(songs.filter(s=>S.downloads.includes(s.id)),'No downloads');else if(r==='queue')x=hero('Queue','Upcoming playback.')+`<button onclick="S.queue=[];save();route()">Clear</button>`+rows(S.queue.map(i=>songs.find(s=>s.id===i)).filter(Boolean),'Queue empty');else if(r==='recent')x=hero('Recently Played','Latest unique songs.')+rows([...new Set(S.history.map(h=>h.id))].map(i=>songs.find(s=>s.id===i)).filter(Boolean),'Nothing played');else if(r==='history')x=hero('History','Timestamped listening history.')+(S.history.map(h=>{const s=songs.find(x=>x.id===h.id);return s?`<div class="panel"><b>${esc(s.title)}</b><div class="meta">${new Date(h.at).toLocaleString()}</div></div>`:''}).join('')||empty('History empty'));else if(['discover','trending','for-you'].includes(r))x=hero(r==='for-you'?'For You':r[0].toUpperCase()+r.slice(1),'Online discovery and recommendations.')+rows(navigator.onLine?songs.slice().sort(()=>Math.random()-.5):[],'Connect to Wi-Fi');else if(r==='upload')x=hero('Upload','GitHub publishing workflow.')+`<div class="panel"><label>GitHub username</label><input id="gu"><label>Classic key</label><input id="gt" type="password"><label>Song</label><select id="gs">${songs.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`)}</select><button onclick="publish()">Fork, push, PR</button><pre id="gl" class="meta"></pre></div>`;else if(r==='pending')x=hero('Pending Songs','Pull requests waiting for review.')+(S.pending.map(p=>`<div class="panel"><b>${esc(p.title)}</b><div class="meta">${p.status} · ${p.comments||0} comments</div><button onclick="window.open('${p.url||''}','_blank')">Open PR</button></div>`).join('')||empty('No pending songs'));else if(r==='published')x=hero('Published Songs','Merged community songs.')+rows(songs.filter(s=>S.published.includes(s.id)),'No published songs');else if(r==='following')x=hero('Following','Creators you follow.')+`<button onclick="follow()">Follow creator</button><div class="grid">${S.following.map(n=>`<div class="card"><h3>${esc(n)}</h3></div>`).join('')||empty('Nobody followed')}</div>`;else if(r==='followers')x=hero('Followers','Creators following you.')+`<div class="grid">${S.followers.map(n=>`<div class="card"><h3>${esc(n)}</h3></div>`).join('')||empty('No followers')}</div>`;else if(r==='notifications')x=hero('Notifications','Publishing and social updates.')+(S.notifications.map(n=>`<div class="panel"><b>${esc(n.title)}</b><p class="meta">${esc(n.body)}</p></div>`).join('')||empty('No notifications'));else if(r==='profile')x=hero(S.profile.name,'Your creator profile.')+`<div class="panel"><label>Name</label><input id="pn" value="${esc(S.profile.name)}"><label>Bio</label><textarea id="pb">${esc(S.profile.bio)}</textarea><button onclick="profileSave()">Save</button></div>`+rows(songs.filter(s=>s.artist===S.profile.name),'No profile songs');else if(r==='equalizer')x=hero('Equalizer','Six-band playback controls.')+`<div class="panel"><div class="grid">${['60Hz','150Hz','400Hz','1kHz','2.4kHz','6kHz'].map(n=>`<div><label>${n}</label><input type="range" min="-12" max="12"></div>`).join('')}</div></div>`;else if(r==='sleep')x=hero('Sleep Timer','Stop playback later.')+`<div class="panel row">${[5,15,30,60].map(m=>`<button onclick="sleepSet(${m})">${m} min</button>`).join('')}<button class="ghost" onclick="clearTimeout(sleep)">Cancel</button></div>`;else if(r==='scanner')x=hero('WAVE Scanner','Validated WAVE v2 text and PNG import.')+`<div class="panel"><label>WAVE v2 text</label><textarea id="wt"></textarea><button onclick="waveImportText()">Import text</button><label>WAVE v2 PNG</label><input type="file" accept="image/png" onchange="waveImportPNG(event)"><p id="ws" class="meta"></p></div>`;else if(r==='guide')x=hero('Guide','Create, organize, listen, share, publish, and work offline.')+`<div class="grid">${['Create in Studio','Import MP3 or WAVE','Like and playlist','Download offline','Share short text','Publish through GitHub'].map(t=>`<div class="card"><h3>${t}</h3></div>`).join('')}</div>`;else if(r==='settings')x=hero('Settings Buffet','Control colors, gradients, surfaces, and behavior.')+settingsUI();else if(r==='song')x=songPage(id);else x=empty('Page not found');$('pages').innerHTML=`<section class="page active" id="page-${r}">${x}</section>`;lockOffline();}
function create(){if(!navigator.onLine&&!S.settings.offline)return note('Offline creation disabled');const s={id:uid(),title:$('ft').value||'Untitled',artist:$('fa').value||'Spudzy',signature:$('fs').value,bars:+$('fb').value,prompt:$('fp').value,lyrics:$('fl').value,tts:true,createdAt:Date.now()};S.songs.unshift(s);save();go('song/'+s.id)}function search(){const q=$('q').value.toLowerCase(),a=S.songs.filter(s=>Object.values(s).some(v=>String(v).toLowerCase().includes(q)));$('qr').innerHTML=rows(a,'No matches')}function like(i){S.liked=S.liked.includes(i)?S.liked.filter(x=>x!==i):[i,...S.liked];save();route()}function queue(i){if(!S.queue.includes(i))S.queue.push(i);save();note('Queued')}function menu(i){active=S.songs.find(s=>s.id===i);modal('Song actions',`<div class="row"><button onclick="go('song/${i}');closeM()">Open</button><button class="ghost" onclick="shareOneClick('${i}')">Share</button><button class="ghost" onclick="downloadSong('${i}')">Download</button><button class="ghost" onclick="waveOpen('${i}')">WAVE CODE</button><button class="ghost" onclick="addPL('${i}')">Playlist</button></div>`)}
function songPage(i){const s=S.songs.find(x=>x.id===i);if(!s)return empty('Song not found');active=s;return hero(esc(s.title),`${esc(s.artist)} · ${esc(s.signature)}`)+`<div class="row"><button onclick="playSong('${s.id}')">▶ Play</button><button class="ghost" onclick="shareOneClick('${s.id}')">Share</button><button class="ghost" onclick="downloadSong('${s.id}')">Download</button><button class="ghost" onclick="waveOpen('${s.id}')">WAVE CODE</button><button class="ghost" onclick="like('${s.id}')">${S.liked.includes(s.id)?'♥ Liked':'♡ Like'}</button></div><div class="panel"><h3>Lyrics</h3><p style="white-space:pre-wrap">${esc(s.lyrics)||'No lyrics'}</p><label>Song notes</label><textarea id="notes">${esc(S.notes[s.id]||'')}</textarea><button onclick="S.notes['${s.id}']=$('notes').value;save();note('Notes saved')">Save notes</button><label>Attach MP3</label><input type="file" accept="audio/mpeg" onchange="attach('${s.id}',event)"></div>`}
async function shareOneClick(i){const s=S.songs.find(x=>x.id===i),data={title:'MusicSpudzy',text:'Listen to '+String(s.title).slice(0,60)};try{if(!navigator.share)throw Error();await navigator.share(data)}catch(e){if(e?.name==='AbortError')return;try{await navigator.clipboard.writeText(data.text);note('Share unavailable; text copied')}catch{note('Share unavailable')}}}async function waveOpen(i){active=S.songs.find(s=>s.id===i);const c=SpudzyWaveV2.createCanvas(active);modal('Validated WAVE v2',`<div id="wc"></div><p class="meta">Checksum-protected text and PNG.</p>`,`<button class="ghost" onclick="closeM()">Close</button><button onclick="waveCopy()">Copy text</button><button onclick="wavePNG()">Download PNG</button>`);c.style.width='100%';$('wc').appendChild(c)}async function waveCopy(){await navigator.clipboard.writeText(SpudzyWaveV2.encodeText(active));note('WAVE text copied')}async function wavePNG(){const b=await SpudzyWaveV2.createPNG(active);blobDown(b,file(active.title)+'-wave-v2.png')}function waveImportText(){try{const s=SpudzyWaveV2.decodeText($('wt').value);S.songs.unshift(s);save();go('song/'+s.id)}catch(e){$('ws').textContent=e.message}}async function waveImportPNG(e){try{const s=await SpudzyWaveV2.decodePNGFile(e.target.files[0]);S.songs.unshift(s);save();go('song/'+s.id)}catch(x){$('ws').textContent=x.message}}
function downloadSong(i){if(!S.downloads.includes(i))S.downloads.push(i);save();note('Added to Downloads')}function newPL(){modal('New playlist','<label>Name</label><input id="np">','<button onclick="S.playlists.push({id:uid(),name:$(\'np\').value,songs:[]});save();closeM();route()">Create</button>')}function openPL(i){const p=S.playlists.find(x=>x.id===i);$('pld').innerHTML=`<div class="panel"><h3>${esc(p.name)}</h3>${rows(p.songs.map(i=>S.songs.find(s=>s.id===i)).filter(Boolean),'Empty')}</div>`}function addPL(i){modal('Add to playlist',S.playlists.map(p=>`<button class="ghost" onclick="S.playlists.find(x=>x.id==='${p.id}').songs.push('${i}');save();closeM()">${esc(p.name)}</button>`).join('')||empty('Create a playlist'))}function follow(){modal('Follow creator','<input id="fn" placeholder="Creator">','<button onclick="S.following.push($(\'fn\').value);save();closeM();route()">Follow</button>')}function profileSave(){S.profile={name:$('pn').value,bio:$('pb').value};save();route()}function sleepSet(m){clearTimeout(sleep);sleep=setTimeout(stop,m*60000);note('Timer set')}function settingsUI(){const styles=['glass','minimal','bright','dim','soft','sharp','compact','spacious','outline','solid','neon','ruby','cherry','crimson','rose','scarlet','ember','lava','sunset','berry','wine','plum','midnight','carbon','mono','paper','pixel','retro','arcade','future','studio','cinema','club','ambient','focus','contrast'];return`<div class="panel two"><div><label>Gradient A</label><input id="sa" type="color" value="${S.settings.a}"></div><div><label>Gradient B</label><input id="sb" type="color" value="${S.settings.b}"></div><div><label>Background</label><input id="sbg" type="color" value="${S.settings.bg}"></div><div><label>Panel</label><input id="sp" type="color" value="${S.settings.panel}"></div><div><label>Text</label><input id="st" type="color" value="${S.settings.text}"></div><div><label>Muted</label><input id="sm" type="color" value="${S.settings.muted}"></div><div><label>Radius</label><input id="sr" type="range" min="0" max="40" value="${S.settings.radius}"></div><div><label>Blur</label><input id="sbl" type="range" min="0" max="40" value="${S.settings.blur}"></div></div><div class="panel"><h3>36 styles</h3><div class="stylegrid">${styles.map(x=>`<button class="ghost" onclick="S.settings.look='${x}';save();apply()">${x}</button>`).join('')}</div><label><input id="so" type="checkbox" style="width:auto" ${S.settings.offline?'checked':''}> Allow offline creation/downloads</label><div class="row"><button onclick="settingsSave()">Save all</button><button class="ghost" onclick="backup()">Export backup</button><button class="ghost" onclick="logout()">Sign out</button></div></div>`}function settingsSave(){Object.assign(S.settings,{a:$('sa').value,b:$('sb').value,bg:$('sbg').value,panel:$('sp').value,text:$('st').value,muted:$('sm').value,radius:+$('sr').value,blur:+$('sbl').value,offline:$('so').checked});save();apply();note('Settings saved')}function backup(){blobDown(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'musicspudzy-backup.json')}

<script>/* Spudzy WAVE v2: validated text payloads and deterministic PNG matrix encoding.
   Load after the MusicSpudzy app. Exposes window.SpudzyWaveV2. */
(() => {
  'use strict';
  const TEXT_PREFIX = 'SPUDZYWAVE2';
  const BIN_MAGIC = new TextEncoder().encode('SPUDWV2!');
  const GRID = 256;
  const CELL = 4;
  const PNG_SIZE = GRID * CELL;
  const MAX_BYTES = Math.floor((GRID * GRID) / 8) - BIN_MAGIC.length - 8;

  function crc32(bytes) {
    let crc = 0xffffffff;
    for (const byte of bytes) {
      crc ^= byte;
      for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
    }
    return (crc ^ 0xffffffff) >>> 0;
  }
  function hex32(n) { return (n >>> 0).toString(16).padStart(8, '0'); }
  function bytesToBase64Url(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  }
  function base64UrlToBytes(value) {
    if (!/^[A-Za-z0-9_-]*$/.test(value)) throw new Error('WAVE payload contains invalid Base64URL characters.');
    let b64 = value.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const binary = atob(b64);
    return Uint8Array.from(binary, c => c.charCodeAt(0));
  }
  function canonicalSong(song) {
    if (!song || typeof song !== 'object' || Array.isArray(song)) throw new Error('Song must be an object.');
    const clean = JSON.parse(JSON.stringify(song));
    if (!clean.id) clean.id = 'spud_' + Date.now().toString(36);
    if (!clean.title) clean.title = 'Untitled Spudzy Wave';
    return clean;
  }
  function encodeText(song) {
    const envelope = { version: 2, app: 'MUSICSPUDZY', song: canonicalSong(song) };
    const jsonBytes = new TextEncoder().encode(JSON.stringify(envelope));
    return `${TEXT_PREFIX}.${bytesToBase64Url(jsonBytes)}.${hex32(crc32(jsonBytes))}`;
  }
  function decodeText(text) {
    const value = String(text || '').trim();
    const parts = value.split('.');
    if (parts.length !== 3 || parts[0] !== TEXT_PREFIX) throw new Error('Not a Spudzy WAVE v2 text payload.');
    if (!/^[0-9a-fA-F]{8}$/.test(parts[2])) throw new Error('WAVE checksum format is invalid.');
    const bytes = base64UrlToBytes(parts[1]);
    const actual = hex32(crc32(bytes));
    if (actual.toLowerCase() !== parts[2].toLowerCase()) throw new Error('WAVE checksum failed. The data is damaged or incomplete.');
    let envelope;
    try { envelope = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)); }
    catch { throw new Error('WAVE JSON or UTF-8 data is invalid.'); }
    if (envelope?.version !== 2 || envelope?.app !== 'MUSICSPUDZY' || !envelope.song) throw new Error('WAVE envelope is invalid.');
    return canonicalSong(envelope.song);
  }
  function writeU32(arr, offset, n) {
    arr[offset] = n >>> 24; arr[offset + 1] = n >>> 16; arr[offset + 2] = n >>> 8; arr[offset + 3] = n;
  }
  function readU32(arr, offset) {
    return (((arr[offset] << 24) >>> 0) | (arr[offset + 1] << 16) | (arr[offset + 2] << 8) | arr[offset + 3]) >>> 0;
  }
  function packetForText(text) {
    const payload = new TextEncoder().encode(text);
    if (payload.length > MAX_BYTES) throw new Error(`WAVE payload is too large (${payload.length} bytes; maximum ${MAX_BYTES}).`);
    const packet = new Uint8Array(BIN_MAGIC.length + 4 + payload.length + 4);
    packet.set(BIN_MAGIC, 0);
    writeU32(packet, BIN_MAGIC.length, payload.length);
    packet.set(payload, BIN_MAGIC.length + 4);
    writeU32(packet, BIN_MAGIC.length + 4 + payload.length, crc32(payload));
    return packet;
  }
  function packetToBits(packet) {
    const bits = [];
    for (const byte of packet) for (let i = 7; i >= 0; i--) bits.push((byte >>> i) & 1);
    return bits;
  }
  function bitsToBytes(bits) {
    const out = new Uint8Array(Math.floor(bits.length / 8));
    for (let i = 0; i < out.length; i++) for (let b = 0; b < 8; b++) out[i] = (out[i] << 1) | bits[i * 8 + b];
    return out;
  }
  function createCanvas(song) {
    const text = encodeText(song);
    const packet = packetForText(text);
    const bits = packetToBits(packet);
    const canvas = document.createElement('canvas');
    canvas.width = PNG_SIZE; canvas.height = PNG_SIZE;
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, PNG_SIZE, PNG_SIZE);
    for (let i = 0; i < GRID * GRID; i++) {
      const bit = i < bits.length ? bits[i] : ((i * 1103515245 + 12345) >>> 30) & 1;
      ctx.fillStyle = bit ? '#000000' : '#ffffff';
      ctx.fillRect((i % GRID) * CELL, Math.floor(i / GRID) * CELL, CELL, CELL);
    }
    canvas.dataset.spudzyWaveText = text;
    return canvas;
  }
  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('PNG creation failed.')), 'image/png'));
  }
  async function createPNG(song) { return canvasToBlob(createCanvas(song)); }
  function decodeImageSource(source) {
    const width = source.videoWidth || source.naturalWidth || source.width;
    const height = source.videoHeight || source.naturalHeight || source.height;
    if (!width || !height) throw new Error('Image dimensions are unavailable.');
    if (Math.abs(width / height - 1) > 0.01) throw new Error('WAVE image must be square.');
    const work = document.createElement('canvas'); work.width = width; work.height = height;
    const ctx = work.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(source, 0, 0, width, height);
    const data = ctx.getImageData(0, 0, width, height).data;
    const bits = [];
    for (let row = 0; row < GRID; row++) for (let col = 0; col < GRID; col++) {
      const x = Math.min(width - 1, Math.floor((col + 0.5) * width / GRID));
      const y = Math.min(height - 1, Math.floor((row + 0.5) * height / GRID));
      const k = (y * width + x) * 4;
      bits.push((data[k] + data[k + 1] + data[k + 2]) / 3 < 128 ? 1 : 0);
    }
    const bytes = bitsToBytes(bits);
    for (let i = 0; i < BIN_MAGIC.length; i++) if (bytes[i] !== BIN_MAGIC[i]) throw new Error('WAVE image header is invalid. Use the original PNG without cropping or rotation.');
    const len = readU32(bytes, BIN_MAGIC.length);
    if (!len || len > MAX_BYTES || BIN_MAGIC.length + 8 + len > bytes.length) throw new Error('WAVE image length is invalid.');
    const start = BIN_MAGIC.length + 4, payload = bytes.slice(start, start + len);
    const expected = readU32(bytes, start + len), actual = crc32(payload);
    if (expected !== actual) throw new Error('WAVE image checksum failed. The image is damaged, compressed, cropped, or rotated.');
    return decodeText(new TextDecoder('utf-8', { fatal: true }).decode(payload));
  }
  async function decodePNGFile(file) {
    if (!(file instanceof Blob)) throw new Error('A PNG Blob or File is required.');
    const bitmap = await createImageBitmap(file);
    try { return decodeImageSource(bitmap); } finally { bitmap.close?.(); }
  }
  async function selfTest() {
    const sample = { id: 'self-test', title: 'Spudzy ✓ Wave 🥔', artist: 'MusicSpudzy', lyrics: 'Unicode test: café 日本語' };
    const text = encodeText(sample), decoded = decodeText(text);
    if (decoded.title !== sample.title || decoded.lyrics !== sample.lyrics) throw new Error('Text round-trip self-test failed.');
    if (typeof document !== 'undefined' && typeof createImageBitmap === 'function') {
      const blob = await createPNG(sample), imageDecoded = await decodePNGFile(blob);
      if (imageDecoded.title !== sample.title || imageDecoded.lyrics !== sample.lyrics) throw new Error('PNG round-trip self-test failed.');
    }
    return { ok: true, textLength: text.length, maxPNGBytes: MAX_BYTES };
  }
  window.SpudzyWaveV2 = { encodeText, decodeText, createCanvas, createPNG, decodeImageSource, decodePNGFile, selfTest, constants: { TEXT_PREFIX, GRID, CELL, PNG_SIZE, MAX_BYTES } };
  /* Compatibility replacements for existing app calls. */
  window.waveText = encodeText;
  window.decodeWaveText = decodeText;
})();
